# render.yaml — Render Infrastructure as Code
# https://docs.render.com/infrastructure-as-code
services:
  - type: web
    name: hero-housing-fintech
    runtime: python
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: uvicorn valuegraph.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./demo.db
      - key: JWT_SECRET
        generateValue: true   # Render generates a random 64-char secret automatically
      - key: APP_ENV
        value: prod
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.13.9"
      # Google Maps JavaScript API browser key (restricted by HTTP referrer in Google Cloud Console)
      - key: MAPS_API_KEY
        value: "AIzaSyA4FPgvXX30oY4E4zKJJC690fZv8N6bSZI"
      # Google Sign-In OAuth client ID — add your Render URL to Authorised JavaScript origins in Google Cloud
      - key: GOOGLE_CLIENT_ID
        value: "871367729058-hsqnf4pj30r7b25n274dd3kml292fcgn.apps.googleusercontent.com"

