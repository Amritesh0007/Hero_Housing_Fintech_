<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSHETRA — Lender workspace</title>
<link rel="icon" type="image/png" sizes="32x32" href="/site/img/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Auth -->
<section id="login" class="login" hidden>
  <svg class="contours" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g id="contour-lines"></g>
  </svg>
  <div class="login-card">
    <img class="login-logo" src="/site/img/kshetra-logo.webp" alt="KSHETRA — Property Intelligence, since 2026" width="200" height="149">
    <h1 class="sr-only">KSHETRA lender sign-in</h1>
    <p class="lede">Every land has a story. Every property has a value.</p>
    <div class="google-signin" id="google-signin" hidden>
      <div id="google-button"></div>
      <p class="or"><span>or continue with email</span></p>
    </div>

    <!-- Tab bar -->
    <div class="auth-tabs" role="tablist" aria-label="Authentication">
      <button class="auth-tab active" role="tab" aria-selected="true" aria-controls="tab-login" id="tab-btn-login" type="button">Sign in</button>
      <button class="auth-tab" role="tab" aria-selected="false" aria-controls="tab-register" id="tab-btn-register" type="button">Create account</button>
    </div>

    <!-- Login tab -->
    <form id="login-form" class="auth-panel" role="tabpanel" aria-labelledby="tab-btn-login" autocomplete="on">
      <label>Email<input name="email" type="email" required autocomplete="username" placeholder="you@company.com"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Enter password"></label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>

    <!-- Register tab -->
    <form id="register-form" class="auth-panel" role="tabpanel" aria-labelledby="tab-btn-register" autocomplete="on" hidden>
      <label>Full name<input name="full_name" type="text" required maxlength="120" autocomplete="name" placeholder="Amritesh Kumar"></label>
      <label>Email<input name="email" type="email" required autocomplete="email" placeholder="you@company.com"></label>
      <label>Phone <span class="optional">(optional)</span><input name="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="+91 98765 43210"></label>
      <label>Password<input name="password" type="password" required minlength="8" maxlength="200" autocomplete="new-password" placeholder="Minimum 8 characters"></label>
      <div class="password-strength" id="pw-strength" hidden>
        <div class="pw-bar"><div class="pw-fill"></div></div>
        <span class="pw-label"></span>
      </div>
      <label>Confirm password<input name="confirm" type="password" required autocomplete="new-password" placeholder="Re-enter password"></label>
      <button class="btn primary" type="submit">Create account</button>
      <p class="auth-fine">You'll be signed in as an <strong>underwriter</strong> — the default role for new accounts.</p>
    </form>

    <p class="form-error" role="alert"></p>

    <!-- Demo quick-fill tags -->
    <div class="demo-tags" id="demo-tags">
      <span class="demo-label">Quick demo:</span>
      <button type="button" class="demo-tag" data-email="demo@kshetra.in" data-password="demo1234">Underwriter</button>
    </div>
  </div>
</section>

<!-- App -->
<div id="shell" class="shell" hidden>
  <nav class="rail" aria-label="Main">
    <a class="rail-brand" href="/">KSHETRA<span>Property Intelligence</span></a>
    <a href="#/value" data-route="value">New valuation</a>
    <a href="#/history" data-route="history">Valuations</a>
    <a href="#/reviews" data-route="reviews" data-staff>Review queue</a>
    <a href="#/market" data-route="market">Market</a>
    <a href="#/model" data-route="model">Model</a>
    <div class="rail-foot">
      <span id="who"></span>
      <button id="logout" class="btn ghost small" type="button">Sign out</button>
    </div>
  </nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="maps.js"></script>
<script src="app.js"></script>
</body>
</html>
