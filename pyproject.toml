[project]
name = "valuegraph"
version = "0.1.0"
description = "Explainable automated valuation model (AVM) for Indian residential property"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",  # crypto: RSA, to verify Google Sign-In tokens
    "argon2-cffi>=23.1",
    "pandas>=3.1,<3.2",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "catboost==1.2.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
valuegraph = "valuegraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valuegraph"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]  # ₹ × − are intentional in Indian-currency docs  # B008: FastAPI Depends() defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
